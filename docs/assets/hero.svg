<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300"
     viewBox="0 0 880 300" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Droide — a terminal coding agent rebuilt from its specification</title>
  <desc id="hero-desc">Droide, a clean-room reimplementation of the droid CLI v1.9.0. On the right, one real chain from the repository: the terminal UI specification, the token table that implements it, and the test that pins it.</desc>

  <style>
    /* Palette: src/ui/tokens.ts — ansi.background, text.primary, text.secondary,
       text.muted, primary, and the border slot. */
    .bg     { fill: #f5f5f5; }
    .card   { fill: #ffffff; stroke: #b0b0b0; }
    .fg     { fill: #1a1a1a; }
    .sec    { fill: #4a4a4a; }
    .muted  { fill: #6b6b6b; }
    .accent { fill: #d75f00; }
    .sans   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    @media (prefers-color-scheme: dark) {
      .bg     { fill: #1c1c1c; }
      .card   { fill: #262626; stroke: #878787; }
      .fg     { fill: #eeeeee; }
      .sec    { fill: #a8a8a8; }
      .muted  { fill: #767676; }
    }
  </style>

  <rect class="bg" width="880" height="300" rx="16"/>

  <g id="title-block" transform="translate(40 0)">
    <text class="mono muted" x="0" y="56" font-size="16" letter-spacing="1.8">CLEAN-ROOM REBUILD · droid v1.9.0</text>

    <text class="sans fg" x="-2" y="132" font-size="68" font-weight="700" letter-spacing="-1.6">Droide</text>

    <text class="sans sec" x="0" y="180" font-size="21">A terminal coding agent,</text>
    <text class="sans sec" x="0" y="208" font-size="21">rebuilt from its specification.</text>

    <text class="mono muted" x="0" y="256" font-size="16">TypeScript · Rust · no build step</text>
  </g>

  <g id="spec-chain" transform="translate(452 32)">
    <rect class="card" x="0" y="0" width="388" height="236" rx="12" stroke-width="1.5"/>
    <text class="mono muted" x="28" y="40" font-size="16" letter-spacing="1.4">SPEC → CODE → TEST</text>

    <rect class="accent" x="28" y="66" width="4" height="16" rx="2"/>
    <text class="mono fg" x="44" y="80" font-size="17">specs/95-terminal-ui.md</text>
    <text class="sans muted" x="44" y="102" font-size="16">clauses D1–D13, each cited</text>

    <rect class="accent" x="28" y="124" width="4" height="16" rx="2"/>
    <text class="mono fg" x="44" y="138" font-size="17">src/ui/tokens.ts</text>
    <text class="sans muted" x="44" y="160" font-size="16">no colour literal of its own</text>

    <rect class="accent" x="28" y="182" width="4" height="16" rx="2"/>
    <text class="mono fg" x="44" y="196" font-size="17">tests/unit/ui/tokens.test.ts</text>
    <text class="sans muted" x="44" y="218" font-size="16">pins every table to the spec</text>
  </g>
</svg>
