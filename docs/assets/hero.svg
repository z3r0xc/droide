<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340"
     viewBox="0 0 1200 340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Droide — a clean-room reimplementation of the droid CLI</title>
  <desc id="hero-desc">Droide: a terminal coding agent rebuilt from its specification. TypeScript product layer, Rust native helper, spec-first method. One chain — spec file, implementation, test — is shown on the right.</desc>

  <style>
    .bg     { fill: #f5f5f5; }
    .card   { fill: #ffffff; stroke: #d8d2cc; }
    .fg     { fill: #1a1a1a; }
    .sec    { fill: #4a4a4a; }
    .muted  { fill: #6b6b6b; }
    .accent { fill: #d75f00; }
    .rule   { stroke: #b0b0b0; }
    .tick   { fill: #d75f00; }
    .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    @media (prefers-color-scheme: dark) {
      .bg     { fill: #1c1c1c; }
      .card   { fill: #262626; stroke: #585858; }
      .fg     { fill: #eeeeee; }
      .sec    { fill: #a8a8a8; }
      .muted  { fill: #767676; }
      .rule   { stroke: #585858; }
    }
  </style>

  <rect class="bg" width="1200" height="340" rx="18"/>

  <!-- identity -->
  <g id="title-block" transform="translate(64 0)">
    <text class="mono muted" x="0" y="68" font-size="18" letter-spacing="2.2">CLEAN-ROOM REIMPLEMENTATION · droid CLI v1.9.0</text>

    <text class="sans fg" x="-4" y="158" font-size="92" font-weight="700" letter-spacing="-2">Droide</text>

    <text class="sans sec" x="0" y="208" font-size="24">A terminal coding agent,</text>
    <text class="sans sec" x="0" y="240" font-size="24">rebuilt from its specification.</text>

    <text class="mono muted" x="0" y="296" font-size="18">TypeScript layer · Rust helper · spec-first method</text>
  </g>

  <!-- one real spec → code → test chain -->
  <g id="chain" transform="translate(680 40)">
    <rect class="card" x="0" y="0" width="456" height="260" rx="14" stroke-width="1.5"/>
    <text class="mono muted" x="32" y="44" font-size="16" letter-spacing="1.6">SPEC → CODE → TEST</text>

    <rect class="tick" x="32" y="74" width="4" height="20" rx="2"/>
    <text class="mono fg" x="48" y="92" font-size="19">specs/95-terminal-ui.md</text>
    <text class="sans muted" x="48" y="114" font-size="18">clauses D1–D13, each cited</text>

    <rect class="tick" x="32" y="136" width="4" height="20" rx="2"/>
    <text class="mono fg" x="48" y="154" font-size="19">src/ui/tokens.ts</text>
    <text class="sans muted" x="48" y="176" font-size="18">no colour literal of its own</text>

    <rect class="tick" x="32" y="198" width="4" height="20" rx="2"/>
    <text class="mono fg" x="48" y="216" font-size="19">tests/unit/ui/tokens.test.ts</text>
    <text class="sans muted" x="48" y="238" font-size="18">pins every table to the spec</text>
  </g>

  <rect class="accent" x="596" y="280" width="12" height="22" rx="2"/>
</svg>