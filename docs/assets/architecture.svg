<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600"
     viewBox="0 0 880 600" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Droide architecture: TypeScript product layer, JSON-lines boundary, Rust native helper</title>
  <desc id="arch-desc">The TypeScript product layer under src/ runs on Node 24 with types stripped and calls one Rust child process over UTF-8 JSON lines, protocol version 1. The helper under crates/droide-native/src/ frames and dispatches eight methods: native.version, search.walk, search.text, path.resolve, sandbox.profile, pty.quote, secrets.protect and secrets.unprotect.</desc>

  <style>
    /* Palette: src/ui/tokens.ts — ansi.background, text.primary, text.secondary,
       text.muted, primary, border, and ansi.blue (the spec slot). */
    .bg     { fill: #f5f5f5; }
    .panel  { fill: #ffffff; stroke: #b0b0b0; }
    .fg     { fill: #1a1a1a; }
    .sec    { fill: #4a4a4a; }
    .muted  { fill: #6b6b6b; }
    .accent { fill: #d75f00; }
    .edge   { stroke: #0057a8; }
    .rule   { stroke: #b0b0b0; }
    .sans   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    @media (prefers-color-scheme: dark) {
      .bg     { fill: #1c1c1c; }
      .panel  { fill: #262626; stroke: #878787; }
      .fg     { fill: #eeeeee; }
      .sec    { fill: #a8a8a8; }
      .muted  { fill: #767676; }
      .edge   { stroke: #5fafd7; }
      .rule   { stroke: #878787; }
      .arrow  { fill: #5fafd7; }
    }
  </style>

  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z" fill="#0057a8"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="600" rx="16"/>

  <g id="heading">
    <text class="mono muted" x="40" y="48" font-size="16" letter-spacing="1.8">ARCHITECTURE</text>
    <text class="sans fg" x="40" y="84" font-size="28" font-weight="600">Two runtimes, one written contract</text>
  </g>

  <!-- product layer -->
  <g id="typescript">
    <rect class="panel" x="40" y="104" width="800" height="136" rx="12" stroke-width="1.5"/>
    <text class="sans fg" x="64" y="140" font-size="20" font-weight="600">TypeScript product layer</text>
    <text class="mono muted" x="816" y="140" font-size="16" text-anchor="end">src/ · Node 24 · types stripped</text>

    <g class="mono fg" font-size="17">
      <text x="64" y="174">cli/</text>
      <text x="252" y="174">agent/</text>
      <text x="440" y="174">tools/</text>
      <text x="628" y="174">session/</text>
      <text x="64" y="204">transport/</text>
      <text x="252" y="204">ui/</text>
      <text x="440" y="204">app/</text>
      <text x="628" y="204">native/client.ts</text>
    </g>
  </g>

  <!-- boundary: one child process, one line per message -->
  <g id="boundary">
    <line class="edge" x1="100" y1="248" x2="100" y2="330" stroke-width="2"
          marker-end="url(#arrow-head)"/>
    <line class="edge" x1="780" y1="330" x2="780" y2="248" stroke-width="2"
          marker-end="url(#arrow-head)"/>

    <text class="mono fg" x="440" y="268" font-size="17" text-anchor="middle">JSON lines · protocol v1 · one child process</text>
    <text class="mono muted" x="440" y="292" font-size="16" text-anchor="middle">UTF-8, one line per message, 1 MiB cap</text>
    <text class="mono muted" x="440" y="316" font-size="16" text-anchor="middle">request {id, method, params} → answer {id, result|error}</text>
  </g>

  <!-- native layer -->
  <g id="rust">
    <rect class="panel" x="40" y="344" width="800" height="140" rx="12" stroke-width="1.5"/>
    <text class="sans fg" x="64" y="380" font-size="20" font-weight="600">Rust native layer</text>
    <text class="mono muted" x="816" y="380" font-size="16" text-anchor="end">crates/droide-native/src/</text>

    <g class="mono fg" font-size="17">
      <text x="64" y="414">main.rs</text>
      <text x="252" y="414">protocol.rs</text>
      <text x="440" y="414">paths.rs</text>
      <text x="628" y="414">search.rs</text>
      <text x="64" y="444">sandbox.rs</text>
      <text x="252" y="444">pty.rs</text>
      <text x="440" y="444">secrets.rs</text>
      <text x="628" y="444">lib.rs</text>
    </g>
  </g>

  <line class="rule" x1="40" y1="524" x2="840" y2="524" stroke-width="1"/>
  <text class="mono muted" x="40" y="552" font-size="16">native.version · search.walk · search.text · path.resolve</text>
  <text class="mono muted" x="40" y="574" font-size="16">sandbox.profile · pty.quote · secrets.protect · secrets.unprotect</text>
</svg>
