[workspace]
resolver = "2"
members = ["crates/droide-native"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
# FFI (pty, DPAPI) needs `unsafe` in a few audited modules; they opt in with
# `#[allow(unsafe_code)]` and are reviewed on their own. Everything else denies it.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
indexing_slicing = "warn"