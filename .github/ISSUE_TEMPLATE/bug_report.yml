name: Bug report
description: Something behaves differently from the specification or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues: do not file them here — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `droide --version` and the package version from `package.json`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Quote the spec clause if you can (`specs/…` §B‹n›).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Exact command, exact output, exit code.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and Node version.
    validations:
      required: true
