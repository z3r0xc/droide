name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Specification gaps are current
        run: npm run gaps:check
      - name: Our identity only
        run: npm run brand:check
      - name: Unit and integration tests
        run: npm test

  typescript-windows:
    # The suite runs where most development happens; the config-context fixture
    # once passed here and failed on Linux, and path rules are per platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Native contract against the real helper
        run: node tools/run-native-tests.mjs

  rust-windows:
    # The same workspace on the platform most users run it on. `.cargo/config.toml`
    # pins rust-lld so no mingw sysroot is needed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - name: Native contract against the real helper
        run: node tools/run-native-tests.mjs
      - run: cargo clippy --workspace --all-targets -- -D warnings

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: No reverse-engineering artefacts are tracked
        run: |
          if git ls-files | grep -E '^(raw|evidence|\.work)/' ; then
            echo "::error::tracked reverse-engineering artefacts"
            exit 1
          fi

  parity:
    # The parity suite compares our CLI against goldens recorded from the
    # our own build. Snapshots are local artefacts (never committed), so this job
    # only runs where they exist and warns when they are missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Snapshots present?
        id: goldens
        run: test -d tests/parity/expected && echo "present=yes" >> "$GITHUB_OUTPUT" || echo "present=no" >> "$GITHUB_OUTPUT"
      - name: Parity check
        if: steps.goldens.outputs.present == 'yes'
        run: npm run test:parity
      - name: Explain skip
        if: steps.goldens.outputs.present != 'yes'
        run: echo "::warning::no CLI snapshots recorded; run 'node tests/parity/run.mjs --record' locally"
