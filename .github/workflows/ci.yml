name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Specification gaps are current
        run: npm run gaps:check
      - name: Unit and integration tests
        run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  parity:
    # The parity suite compares our CLI against goldens recorded from the
    # subject. Goldens are local artefacts (never committed), so this job only
    # runs where they exist and fails loudly if they are missing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Goldens present?
        id: goldens
        run: test -d .work/parity/expected && echo "present=yes" >> "$GITHUB_OUTPUT" || echo "present=no" >> "$GITHUB_OUTPUT"
      - name: Parity check
        if: steps.goldens.outputs.present == 'yes'
        run: npm run test:parity
      - name: Explain skip
        if: steps.goldens.outputs.present != 'yes'
        run: echo "::warning::parity goldens are absent; run 'npm run test:parity:record' locally with the subject binary"